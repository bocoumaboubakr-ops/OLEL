version: '3.9'

# ── OLEL – Stack Production complète ────────────────────────────────────────
# Inclut : Nginx, Prometheus, Grafana, exporters
# Usage  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: olel-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_started
      mobile:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro      # certificats Let's Encrypt
      - certbot_www:/var/www/certbot              # challenge ACME (renouvellement)
      - certbot_signal:/var/run/certbot-signal    # signal de rechargement après renouvellement
      - nginx_logs:/var/log/nginx
    # Recharge Nginx (sans coupure) quand Certbot a renouvelé un certificat (audit F32)
    command: ["/bin/sh", "-c", "while :; do sleep 300; if [ -f /var/run/certbot-signal/reload ]; then rm -f /var/run/certbot-signal/reload; nginx -t && nginx -s reload && echo 'nginx rechargé (certificat renouvelé)'; fi; done & exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot (renouvellement automatique TLS) ────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: olel-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - certbot_signal:/var/run/certbot-signal
    # Le hook de déploiement signale le renouvellement : Nginx recharge les certificats
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --quiet --webroot --webroot-path=/var/www/certbot --deploy-hook 'touch /var/run/certbot-signal/reload';
               sleep 12h & wait $${!};
             done"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: olel-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Jeton de collecte des métriques du backend (= METRICS_TOKEN), fichier non versionné
      - ./monitoring/prometheus/metrics.token:/etc/prometheus/metrics.token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    profiles:
      - monitoring

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: olel-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Aucun mot de passe par défaut (audit F32)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD requis pour le profil monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3003:3000"
    profiles:
      - monitoring

  # ── Postgres Exporter ─────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: olel-postgres-exporter
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_NAME: postgresql://olel:${POSTGRES_PASSWORD}@postgres:5432/olel?sslmode=disable
    profiles:
      - monitoring

  # ── Redis Exporter ────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: olel-redis-exporter
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    profiles:
      - monitoring

  # ── Sauvegardes ─────────────────────────────────────────────────────────────
  # Plus de conteneur de sauvegarde monté sur le socket Docker (audit F31) :
  # scripts/backup.sh est lancé par la crontab de l'HÔTE (scripts/setup-backup.sh),
  # chiffré, avec copie hors serveur (RCLONE_REMOTE) et alerte en cas d'échec.

volumes:
  nginx_logs:
  certbot_www:
  certbot_signal:
  prometheus_data:
  grafana_data:
