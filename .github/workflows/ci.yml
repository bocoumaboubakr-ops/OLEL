name: CI

# Vérifie TOUS les composants sur la branche destinée au déploiement
# (audit F28) : installation figée, lint, types, tests unitaires et e2e
# (PostgreSQL + Redis réels, fournisseurs simulés), builds et images.
on:
  push:
    branches: [main, develop, "claude/**", "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & types (5 composants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: cd backend && npx prisma generate
      - run: pnpm type-check
      - run: pnpm lint

  test-backend:
    name: Backend — unitaires et e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: olel_test
          POSTGRES_USER: olel
          POSTGRES_PASSWORD: olel_test_pwd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
    env:
      DATABASE_URL: postgresql://olel:olel_test_pwd@localhost:5432/olel_test
      TEST_DATABASE_URL: postgresql://olel:olel_test_pwd@localhost:5432/olel_test
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: cd backend && npx prisma generate && npx prisma migrate deploy
      - name: Tests unitaires
        run: cd backend && pnpm test --coverage
      - name: Tests e2e (chaîne d'alerte, droits, canaux, médias, relais, supervision)
        run: cd backend && pnpm test:e2e --forceExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  test-bot:
    name: Bot — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: cd apps/bot && pnpm test

  build:
    name: Builds applicatifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: cd backend && npx prisma generate
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  build-docker:
    name: Images Docker (contexte racine, lockfile du monorepo)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend, test-bot]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, apps/bot, apps/dashboard, apps/mobile, apps/landing]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: false
          tags: olel/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
