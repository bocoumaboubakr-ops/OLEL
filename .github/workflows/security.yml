name: Security Scan

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main, "release/**"]

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Dépendances exécutées en production : aucun avis critique toléré.
      # Les avis « high » restants concernent des outils de build (plugin
      # webpack de Sentry, postcss interne à Next) : suivis dans
      # docs/AUDIT_REMEDIATION.md (F29) et listés ci-dessous sans bloquer.
      - name: Audit (production, bloquant ≥ critical)
        run: pnpm audit --prod --audit-level=critical
      - name: Audit complet (informatif)
        run: pnpm audit --audit-level=high || true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
