worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Limits
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;

    # Upstream services
    upstream backend {
        server backend:4000;
        keepalive 32;
    }

    upstream dashboard {
        server dashboard:3000;
        keepalive 16;
    }

    upstream mobile {
        server mobile:3001;
        keepalive 16;
    }

    upstream bot {
        server bot:3002;
        keepalive 8;
    }

    # Headers de sécurité communs
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
    }

    # ── API Backend ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.olel.sn api.olel.local;

        # Redirect HTTP → HTTPS en prod
        # return 301 https://$server_name$request_uri;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Health check (sans rate limit)
        location /api/v1/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Auth endpoints — rate limit strict
        location ~ ^/api/v1/auth/(login|totp) {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API générale
        location /api/ {
            limit_req zone=api_global burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Swagger docs (désactiver en prod)
        location /api-docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }

    # ── Dashboard ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name dashboard.olel.sn olel.sn www.olel.sn dashboard.olel.local;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache Next.js static assets
            location ~* \.(js|css|png|jpg|ico|woff2)$ {
                proxy_pass http://dashboard;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ── App Mobile ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name mobile.olel.sn app.olel.sn mobile.olel.local;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://mobile;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Service Worker — ne pas cacher
        location /sw.js {
            proxy_pass http://mobile;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ── Bot Webhook (WhatsApp) ────────────────────────────────────────────────
    server {
        listen 80;
        server_name bot.olel.sn bot.olel.local;

        # Seul Meta peut appeler ce webhook
        location /webhook/whatsapp {
            limit_req zone=webhook burst=50 nodelay;

            proxy_pass http://bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        location / {
            return 404;
        }
    }
}
