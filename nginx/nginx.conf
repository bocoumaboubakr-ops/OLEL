worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; use epoll; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    types_hash_max_size 2048; server_tokens off;

    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 20m;   # autorise les vocaux et photos
    client_body_timeout 30s; client_header_timeout 30s;

    # Rate limit
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=300r/m;

    # Upstream services Docker
    upstream backend   { server backend:4000;   keepalive 32; }
    upstream dashboard { server dashboard:3000; keepalive 16; }
    upstream mobile    { server mobile:3001;    keepalive 16; }
    upstream bot       { server bot:3002;       keepalive 8;  }
    upstream landing   { server landing:3004;   keepalive 16; }

    # ── HTTP : ACME challenge + redirect vers HTTPS ────────────────────────
    server {
        listen 80 default_server;
        server_name olel.app www.olel.app api.olel.app app.olel.app m.olel.app bot.olel.app;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ───────────────────────────────────────────────────────────────────────
    # api.olel.app — Backend NestJS (+ WS Socket.IO + /uploads médias)
    # ───────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.olel.app;

        ssl_certificate     /etc/letsencrypt/live/olel.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/olel.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        location /api/v1/auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_valid 200 1h;
            expires 1h;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ───────────────────────────────────────────────────────────────────────
    # olel.app + www.olel.app — Landing publique institutionnelle (Next.js)
    # ───────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name olel.app www.olel.app;

        ssl_certificate     /etc/letsencrypt/live/olel.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/olel.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://landing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ───────────────────────────────────────────────────────────────────────
    # app.olel.app — Dashboard autorités (Next.js, authentifié)
    # ───────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.olel.app;

        ssl_certificate     /etc/letsencrypt/live/olel.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/olel.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ───────────────────────────────────────────────────────────────────────
    # m.olel.app — Mobile PWA (citoyen + sentinelle)
    # ───────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name m.olel.app;

        ssl_certificate     /etc/letsencrypt/live/olel.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/olel.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(self)" always;

        location / {
            proxy_pass http://mobile;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ───────────────────────────────────────────────────────────────────────
    # bot.olel.app — Bot WhatsApp (webhook Meta)
    # ───────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name bot.olel.app;

        ssl_certificate     /etc/letsencrypt/live/olel.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/olel.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /webhook/ {
            limit_req zone=webhook burst=50 nodelay;
            proxy_pass http://bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /health { proxy_pass http://bot; access_log off; }
        location / { return 404; }
    }
}
